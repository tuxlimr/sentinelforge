[project]
# Distribution name only: "sentinelforge" on PyPI is an unrelated project. Import name and CLI stay `sentinelforge`.
name = "sentinelforge-ai"
dynamic = ["version"]  # from sentinelforge/__init__.py
description = "Security regression testing for LLM apps, RAG pipelines and agents: find, verify, regress."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SentinelForge contributors" }]
keywords = ["llm", "ai-security", "prompt-injection", "red-teaming", "rag", "agents", "security-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27", "typer>=0.12", "rich>=13", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/tuxlimr/sentinelforge"
Documentation = "https://github.com/tuxlimr/sentinelforge#readme"
Issues = "https://github.com/tuxlimr/sentinelforge/issues"
Changelog = "https://github.com/tuxlimr/sentinelforge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinelforge = "sentinelforge.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "sentinelforge.__version__" }

[tool.setuptools.packages.find]
include = ["sentinelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
