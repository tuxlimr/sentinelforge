[project]
name = "sentinelforge"
version = "0.1.0"
description = "Security regression testing for LLM apps, RAG pipelines and agents"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27", "typer>=0.12", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinelforge = "sentinelforge.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentinelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
